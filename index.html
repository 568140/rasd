<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        if (typeof window === 'undefined') return;

        // Suppress benign Vite HMR / WebSocket connection errors in iFrame sandbox
        const origConsoleError = console.error;
        console.error = function (...args) {
          const first = args[0];
          if (
            typeof first === 'string' &&
            (first.includes('[vite]') ||
              first.includes('WebSocket') ||
              first.includes('WebSocket closed without opened'))
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        window.addEventListener(
          'error',
          function (e) {
            const msg = (e && (e.message || (e.error && e.error.message))) || '';
            if (
              msg.includes('WebSocket') ||
              msg.includes('vite:ws') ||
              msg.includes('@vite/client') ||
              msg.includes('WebSocket closed without opened')
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            const reason = (e && (e.reason && (e.reason.message || String(e.reason)))) || '';
            if (reason.includes('WebSocket') || reason.includes('vite') || reason.includes('hmr')) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        const PatchedWebSocket = function (url, protocols) {
          const listeners = { open: [], message: [], close: [], error: [] };
          const ws = Object.create(PatchedWebSocket.prototype);

          Object.assign(ws, {
            url: String(url || ''),
            protocol: Array.isArray(protocols) ? protocols.join(',') : String(protocols || ''),
            readyState: 1, // 1 === OPEN
            CONNECTING: 0,
            OPEN: 1,
            CLOSING: 2,
            CLOSED: 3,
            bufferedAmount: 0,
            extensions: '',
            binaryType: 'blob',
            onopen: null,
            onmessage: null,
            onclose: null,
            onerror: null,
            addEventListener: function (type, fn) {
              if (typeof fn !== 'function') return;
              if (listeners[type]) listeners[type].push(fn);
              if (type === 'open') {
                try {
                  fn.call(ws, { type: 'open', target: ws });
                } catch (e) {}
              }
            },
            removeEventListener: function (type, fn) {
              if (listeners[type]) {
                listeners[type] = listeners[type].filter(function (cb) {
                  return cb !== fn;
                });
              }
            },
            dispatchEvent: function (evt) {
              const fns = listeners[evt.type] || [];
              for (let i = 0; i < fns.length; i++) {
                try {
                  fns[i].call(ws, evt);
                } catch (e) {}
              }
              return true;
            },
            send: function () {},
            close: function () {
              ws.readyState = 3;
            },
          });

          // Trigger onopen callback if assigned as property
          setTimeout(function () {
            if (typeof ws.onopen === 'function') {
              try {
                ws.onopen({ type: 'open', target: ws });
              } catch (e) {}
            }
          }, 0);

          return ws;
        };

        PatchedWebSocket.prototype = {
          CONNECTING: 0,
          OPEN: 1,
          CLOSING: 2,
          CLOSED: 3,
        };
        Object.assign(PatchedWebSocket, PatchedWebSocket.prototype);

        window.WebSocket = PatchedWebSocket;

        // Evict stale Service Worker caches (rasd-cache-v1..v5) so updated UI bundles load immediately
        if ('caches' in window) {
          caches
            .keys()
            .then(function (keys) {
              const staleKeys = keys.filter(function (k) {
                return k !== 'rasd-cache-v6' && (k.indexOf('rasd-cache-') === 0 || k.indexOf('workbox-') === 0);
              });
              if (staleKeys.length > 0) {
                Promise.all(
                  staleKeys.map(function (k) {
                    return caches.delete(k);
                  })
                ).then(function () {
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                      regs.forEach(function (r) {
                        r.update();
                      });
                    });
                  }
                });
              }
            })
            .catch(function () {});
        }
      })();
    </script>
