    <meta charset="UTF-8" />
    <script>
      (function () {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        const NativeWebSocket = window.WebSocket;
        function ViteNoopWebSocket(url, protocols) {
          const target = new EventTarget();
          target.url = String(url || '');
          target.protocol = Array.isArray(protocols) ? protocols[0] || '' : String(protocols || '');
          target.readyState = 1;
          target.bufferedAmount = 0;
          target.extensions = '';
          target.binaryType = 'blob';
          target.send = function () {};
          target.close = function () {
            target.readyState = 3;
          };
          setTimeout(function () {
            const evt = new Event('open');
            if (typeof target.onopen === 'function') target.onopen(evt);
            target.dispatchEvent(evt);
          }, 0);
          return target;
        }
        const PatchedWebSocket = function (url, protocols) {
          const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          if (protoStr.includes('vite-hmr') || protoStr.includes('vite-ping')) {
            return ViteNoopWebSocket(url, protocols);
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        };
        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
        PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
